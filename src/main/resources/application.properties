spring.application.name=facturaventa
server.port=8080
# Persistencia demo local: se conserva entre reinicios en ./facturas.mv.db.
spring.datasource.url=jdbc:h2:file:./facturas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
app.demo-data.enabled=true

# Integración ARCA: desactivada hasta disponer de certificado de homologación.
# Nunca habilitar producción desde este adaptador académico.
arca.enabled=${ARCA_ENABLED:false}
arca.environment=homologacion
arca.cuit=${ARCA_CUIT:}
arca.pkcs12-path=${ARCA_PKCS12_PATH:}
arca.pkcs12-password=${ARCA_PKCS12_PASSWORD:}
arca.pkcs12-alias=${ARCA_PKCS12_ALIAS:}

# Evitar mezclar pantallas antiguas con JavaScript actualizado.
spring.web.resources.cache.cachecontrol.no-store=true

